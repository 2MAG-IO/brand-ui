name: Publish to npm

# Publishing is triggered by creating a GitHub Release (which carries the version tag).
# Authentication is via npm Trusted Publishing (OIDC): NO npm token is stored anywhere.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # REQUIRED for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing needs a recent npm (>= 11.5.1).
      - name: Upgrade npm
        run: npm install -g npm@latest

      # No NODE_AUTH_TOKEN: the OIDC id-token above authenticates to npm.
      # Provenance is generated automatically for trusted-publisher packages.
      - name: Publish
        run: npm publish
